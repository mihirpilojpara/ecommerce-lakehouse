version: 2

sources:
  - name: gold
    description: Star schema written by the Spark gold job, read straight from Delta Lake.
    meta:
      external_location: "delta_scan('/opt/lakehouse/gold/{name}')"
    tables:
      - name: dim_date
        columns:
          - name: date_key
            tests: [unique, not_null]

      - name: dim_customer
        columns:
          - name: customer_sk
            tests: [unique, not_null]

      - name: dim_product
        columns:
          - name: product_sk
            tests: [unique, not_null]

      - name: dim_seller
        columns:
          - name: seller_sk
            tests: [unique, not_null]

      - name: fact_order_items
        description: One row per item sold.
        columns:
          - name: order_item_sk
            tests: [unique, not_null]
          - name: customer_sk
            tests:
              - not_null
              - relationships:
                  to: source('gold', 'dim_customer')
                  field: customer_sk
          - name: product_sk
            tests:
              - not_null
              - relationships:
                  to: source('gold', 'dim_product')
                  field: product_sk
          - name: seller_sk
            tests:
              - not_null
              - relationships:
                  to: source('gold', 'dim_seller')
                  field: seller_sk
          - name: purchase_date_key
            tests:
              - not_null
              - relationships:
                  to: source('gold', 'dim_date')
                  field: date_key
          - name: order_status
            tests:
              - accepted_values:
                  values: [created, approved, invoiced, processing, shipped, delivered, canceled, unavailable]
