[project]
name = "ecommerce-lakehouse"
version = "1.0.0"
description = "Medallion lakehouse on the Olist e-commerce dataset with PySpark, Delta Lake, Airflow and dbt"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
